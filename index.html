<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="調査士択一">
<title>土地家屋調査士 択一演習</title>
<style>
  :root{
    --ink:#20302e;--paper:#eef0ea;--paper-2:#e5e8df;--card:#f7f8f3;


    --brand:#2f5d50;--brand-strong:#254a3f;--accent:#c8542b;
    --correct:#2c7a5b;--correct-bg:#e2efe7;--wrong:#b23b2e;--wrong-bg:#f3e2df;
    --muted:#6f7a72;--line:rgba(32,48,46,.14);--line-strong:rgba(32,48,46,.28);
    --m1:#b23b2e;--m2:#cf6a34;--m3:#be9a2e;--m4:#4f8a5f;--m5:#2c7a5b;
    --radius:14px;
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","BIZ UDPGothic",Meiryo,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--gothic);color:var(--ink);background-color:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));}
  .topbar{padding:calc(14px + env(safe-area-inset-top)) 16px 12px;max-width:520px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line-strong);}
  .brand-title{font-family:var(--mincho);font-size:20px;font-weight:600;letter-spacing:.04em;margin:0;}
  .brand-sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:2px;}
  .coord{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-align:right;line-height:1.5;}
  .view{animation:fade .28s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.view{animation:none;}*{transition:none!important;animation:none!important;}}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);margin:26px 0 10px;display:flex;align-items:center;gap:8px;}
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line-strong);}
  .yacho{position:relative;background:var(--brand);color:#f2f5ef;border-radius:var(--radius);padding:18px 18px 16px;margin-top:14px;overflow:hidden;box-shadow:0 6px 22px rgba(37,74,63,.22);}
  .yacho-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;opacity:.8;text-transform:uppercase;}
  .yacho-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px;}
  .stat .num{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1;}
  .stat .cap{font-size:11px;opacity:.82;margin-top:5px;}
  .yacho-foot{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);font-size:12px;display:flex;justify-content:space-between;opacity:.9;}
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .btn{font-family:var(--gothic);font-size:15px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius);padding:15px 16px;text-align:left;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:transform .08s,border-color .15s;}
  .btn:active{transform:scale(.985);}
  .btn .arw{font-family:var(--mono);color:var(--muted);font-size:15px;}
  .btn.primary{background:var(--brand);color:#f2f5ef;border-color:var(--brand-strong);}
  .btn.primary .arw{color:rgba(255,255,255,.8);}
  .btn.ghost{background:transparent;}
  .btn.small{font-size:13px;padding:11px 13px;}
  .btn.danger{color:var(--wrong);border-color:var(--wrong);background:transparent;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-sub{font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px;}
  .btn-main{display:flex;flex-direction:column;}
  .row{display:flex;gap:8px;}.row>*{flex:1;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{font-family:var(--gothic);font-size:13px;padding:8px 13px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer;transition:all .12s;}
  .chip.on{background:var(--brand);color:#f2f5ef;border-color:var(--brand);}
  .chip.sm{font-size:12px;padding:6px 11px;}
  .field-label{font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.08em;margin:16px 0 2px;text-transform:uppercase;}
  .field-label:first-child{margin-top:4px;}
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;gap:8px;}
  .tagline{display:flex;gap:6px;flex-wrap:wrap;}
  .qcat{background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--brand-strong);font-weight:600;}
  .qyear{background:transparent;border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;color:var(--muted);}
  .prog{height:4px;background:var(--paper-2);border-radius:4px;margin-top:8px;overflow:hidden;}
  .prog>span{display:block;height:100%;background:var(--brand);transition:width .3s;}
  .stem{font-size:13.5px;color:var(--muted);background:var(--paper-2);border-radius:10px;padding:10px 12px;margin-top:14px;line-height:1.7;white-space:pre-wrap;}
  .qtext{font-size:16.5px;line-height:1.85;margin:14px 0 4px;white-space:pre-wrap;}
  .blab{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;font-family:var(--mono);font-size:13px;font-weight:700;margin-right:8px;vertical-align:2px;}
  .branchline{display:flex;gap:9px;align-items:flex-start;margin-top:9px;font-size:14px;line-height:1.7;}
  .branchline .bl{flex:0 0 auto;min-width:24px;height:24px;border-radius:7px;background:var(--paper-2);color:var(--brand-strong);font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .branchline .mkr{flex:0 0 auto;font-family:var(--mono);font-weight:800;margin-top:2px;}
  .branchline .mkr.o{color:var(--correct);}.branchline .mkr.x{color:var(--wrong);}
  .ox-choices{display:flex;gap:10px;margin-top:18px;}
  .oxbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:20px 0;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--card);cursor:pointer;font-family:var(--gothic);transition:transform .07s,border-color .15s,background .15s;}
  .oxbtn:active{transform:scale(.98);}
  .oxbtn .mk{font-size:30px;line-height:1;font-family:var(--mono);}
  .oxbtn .tx{font-size:12px;color:var(--muted);}
  .oxbtn.o .mk{color:var(--correct);}
  .oxbtn.x .mk{color:var(--wrong);}
  .oxbtn.pick-wrong{background:var(--wrong-bg);border-color:var(--wrong);}
  .oxbtn.reveal{border-color:var(--correct);background:var(--correct-bg);}
  .oxbtn.dim{opacity:.5;}
  .choices{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
  .choice{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line-strong);border-radius:12px;padding:13px 14px;font-family:var(--gothic);font-size:14.5px;color:var(--ink);cursor:pointer;transition:transform .07s,border-color .15s;}
  .choice .no{font-family:var(--mono);font-weight:600;color:var(--brand);min-width:20px;}
  .choice.correct{background:var(--correct-bg);border-color:var(--correct);}.choice.correct .no{color:var(--correct);}
  .choice.wrong{background:var(--wrong-bg);border-color:var(--wrong);}.choice.wrong .no{color:var(--wrong);}
  .choice.dim{opacity:.55;}
  .verdict{margin-top:16px;border-radius:12px;padding:13px 14px;font-size:14px;border:1px solid;}
  .verdict.ok{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);}
  .verdict.ng{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong);}
  .verdict b{font-family:var(--mincho);font-size:15px;}
  .expl{margin-top:12px;background:var(--paper-2);border-radius:12px;padding:13px 14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;}
  .expl .h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:5px;}
  .mrate{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;}
  .mrate .lab{font-size:12px;color:var(--muted);margin-bottom:8px;font-family:var(--mono);letter-spacing:.06em;}
  .mastery-ctl{display:flex;gap:6px;}
  .mstar{flex:1;font-family:var(--mono);font-size:14px;font-weight:600;padding:9px 0;border-radius:9px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);cursor:pointer;transition:all .12s;}
  .mstar.clr{flex:0 0 40px;}
  .mastery-ctl.lv1 .mstar.on{background:var(--m1);border-color:var(--m1);color:#fff;}
  .mastery-ctl.lv2 .mstar.on{background:var(--m2);border-color:var(--m2);color:#fff;}
  .mastery-ctl.lv3 .mstar.on{background:var(--m3);border-color:var(--m3);color:#fff;}
  .mastery-ctl.lv4 .mstar.on{background:var(--m4);border-color:var(--m4);color:#fff;}
  .mastery-ctl.lv5 .mstar.on{background:var(--m5);border-color:var(--m5);color:#fff;}
  .mbadge{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);}
  .mbadge.none{color:var(--muted);}
  .mbadge.lv1{color:var(--m1);border-color:var(--m1);}.mbadge.lv2{color:var(--m2);border-color:var(--m2);}
  .mbadge.lv3{color:var(--m3);border-color:var(--m3);}.mbadge.lv4{color:var(--m4);border-color:var(--m4);}.mbadge.lv5{color:var(--m5);border-color:var(--m5);}
  .score-big{font-family:var(--mono);font-size:54px;font-weight:600;text-align:center;margin:6px 0 0;color:var(--brand);}
  .score-cap{text-align:center;color:var(--muted);font-size:13px;}
  .qitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-top:9px;cursor:pointer;transition:border-color .15s;}
  .qitem:active{border-color:var(--brand);}
  .qitem .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
  .qitem .cat{font-size:11px;font-weight:600;color:var(--brand-strong);background:var(--paper-2);border-radius:999px;padding:2px 9px;}
  .qitem .yr{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
  .qitem .body{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  input[type=text],textarea,select{width:100%;font-family:var(--gothic);font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;margin-top:5px;}
  textarea{resize:vertical;min-height:60px;line-height:1.6;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand);}
  .bredit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:10px;}
  .bredit .bhead{display:flex;align-items:center;gap:8px;}
  .bredit .bhead .bl{min-width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;font-family:var(--mono);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .bredit .bhead .sp{flex:1;}
  .bredit .rm{background:transparent;border:none;color:var(--muted);font-size:19px;cursor:pointer;padding:2px 8px;}
  .truthpick{display:flex;gap:6px;}
  .truthpick button{padding:7px 13px;border-radius:9px;border:1.5px solid var(--line-strong);background:#fff;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;}
  .truthpick button.sel.o{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);}
  .truthpick button.sel.x{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong);}
  .truthpick button.sel.n{background:var(--paper-2);border-color:var(--muted);color:var(--ink);}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;}
  .empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:14px;line-height:1.8;}
  .empty .mk{font-family:var(--mono);font-size:26px;color:var(--line-strong);}
  .backlink{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;color:var(--brand);font-family:var(--gothic);font-size:14px;font-weight:600;cursor:pointer;padding:16px 0 2px;}
  .warn{background:var(--wrong-bg);border:1px solid var(--wrong);color:var(--wrong);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:10px;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));background:var(--ink);color:#f2f5ef;padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .modal-back{position:fixed;inset:0;background:rgba(20,30,28,.45);display:flex;align-items:center;justify-content:center;padding:22px;z-index:100;animation:fade .18s ease;}
  .modal{background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(20,30,28,.3);}
  .modal .mt{font-family:var(--mincho);font-size:17px;font-weight:600;}
  .modal .mb{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7;}
  .modal input[type=text]{margin-top:12px;}
  .modal .ma{display:flex;gap:8px;margin-top:18px;}
  .mbtn{flex:1;font-family:var(--gothic);font-size:14px;font-weight:600;padding:12px 0;border-radius:11px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer;}
  .mbtn.pr{background:var(--brand);border-color:var(--brand-strong);color:#f2f5ef;}
  .mbtn.dg{background:var(--wrong);border-color:var(--wrong);color:#fff;}
  .rowlabel{font-size:11px;color:var(--muted);font-family:var(--mono);margin:14px 0 0;letter-spacing:.06em;text-transform:uppercase;}
  .quizbar{display:flex;gap:6px;padding-top:12px;}
  .recbar{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .recbar .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;}
  .recbar .rv{font-size:13px;margin-left:auto;}
  .recbar .rv.muted{color:var(--muted);font-size:12.5px;}
  .recbar .rv b{font-family:var(--mono);font-size:16px;margin-right:2px;}
  .recbar .rv b.g{color:var(--correct);}.recbar .rv b.y{color:var(--m3);}.recbar .rv b.r{color:var(--wrong);}
  .recbar .rmini{flex:0 0 100%;height:5px;border-radius:4px;background:var(--paper-2);overflow:hidden;}
  .recbar .rmini-f{display:block;height:100%;border-radius:4px;}
  .recbar .rmini-f.g{background:var(--correct);}.recbar .rmini-f.y{background:var(--m3);}.recbar .rmini-f.r{background:var(--wrong);}
  .rate{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid;}
  .rate .sm{font-weight:400;font-size:9.5px;opacity:.8;}
  .rate.g{color:var(--correct);border-color:var(--correct);}
  .rate.y{color:var(--m3);border-color:var(--m3);}
  .rate.r{color:var(--wrong);border-color:var(--wrong);}
  .rate.muted{color:var(--muted);border-color:var(--line-strong);font-weight:400;}
  .qbtn{flex:1;font-family:var(--gothic);font-size:11.5px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--line-strong);border-radius:9px;padding:8px 4px;cursor:pointer;}
  .qbtn.danger{color:var(--wrong);border-color:rgba(178,59,46,.35);flex:0 0 66px;}
  .bigwrap{display:flex;gap:10px;margin-top:14px;}
  .bigcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;text-align:center;}
  .bigcard .p{font-family:var(--mono);font-size:34px;font-weight:600;color:var(--brand);line-height:1;}
  .bigcard .l{font-size:11px;color:var(--muted);margin-top:6px;}
  .bigcard .s{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;}
  .mrow{margin-top:13px;}
  .mrow .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;}
  .mrow .lbl .pct{font-family:var(--mono);font-weight:600;color:var(--brand);}
  .bar{height:9px;border-radius:6px;background:var(--paper-2);overflow:hidden;margin-top:5px;}
  .bar>span{display:block;height:100%;border-radius:6px;background:var(--brand);}
  .mrow .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px;}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .cal-head .mo{font-family:var(--mincho);font-size:17px;font-weight:600;}
  .cal-nav{background:var(--card);border:1px solid var(--line-strong);border-radius:10px;width:40px;height:36px;font-size:16px;color:var(--ink);cursor:pointer;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;}
  .cal-dow{text-align:center;font-size:10px;color:var(--muted);font-family:var(--mono);padding:2px 0;}
  .cal-cell{aspect-ratio:1;border-radius:8px;background:var(--paper-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .cal-cell.empty{background:transparent;}
  .cal-cell .d{font-family:var(--mono);font-size:9.5px;color:var(--muted);}
  .cal-cell .c{font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;}
  .cal-cell.today{outline:2px solid var(--brand);outline-offset:-2px;}
  /* rabbit */
  .rabbit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:18px;}
  .rabbit .top{display:flex;gap:12px;align-items:center;}
  .rabbit .scene{flex:0 0 auto;display:flex;align-items:flex-end;}
  .rabbit .info{flex:1;min-width:0;}
  .rabbit .nm{font-family:var(--mincho);font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .rabbit .nm .pen{font-size:11px;color:var(--muted);}
  .rabbit .stg{font-family:var(--mono);font-size:10.5px;color:var(--brand);letter-spacing:.06em;margin-top:2px;}
  .rabbit .msg{font-size:13px;line-height:1.6;margin-top:7px;}
  .rabbit .lvbar{height:6px;border-radius:5px;background:rgba(32,48,46,.12);overflow:hidden;margin-top:9px;}
  .rabbit .lvbar>span{display:block;height:100%;background:var(--brand);border-radius:5px;}
  .rabbit .nx{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;}
  .rabbit .comps{display:flex;align-items:flex-end;gap:0;margin-top:6px;padding-left:6px;}
  .rabbit .comps>div{margin-right:-8px;}
  .rabbit .compcap{font-size:10.5px;color:var(--muted);margin-top:2px;padding-left:8px;}
  .levelup{background:var(--correct-bg);border:1px solid var(--correct);border-radius:12px;padding:12px 14px;margin-top:14px;display:flex;gap:10px;align-items:center;}
  .levelup .t{font-size:13.5px;color:var(--brand-strong);line-height:1.6;}
  .levelup .t b{font-family:var(--mincho);}
  .rb .rb-body{animation:rbBreathe 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
  .rb .rb-ear1{animation:rbEar 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 95%;}
  .rb .rb-ear2{animation:rbEar 8.5s ease-in-out infinite 2.2s;transform-box:fill-box;transform-origin:50% 95%;}
  .rb .rb-lid{animation:rbBlink 5.2s linear infinite;}
  .rb .rb-head{animation:rbTilt 9s ease-in-out infinite;transform-box:fill-box;transform-origin:60% 90%;}

<script>

/* =====================================================

/* ---------- クラウド同期（Firestore） ---------- */
const Cloud={enabled:false,user:null,db:null,unsubs:[]};
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement("script");sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});}
async function initCloud(){
  if(!FIREBASE_CONFIG)return false;
  try{
    const V="10.12.2";
    await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
    firebase.initializeApp(FIREBASE_CONFIG);
    Cloud.db=firebase.firestore();
    try{await Cloud.db.enablePersistence({synchronizeTabs:true});}catch(e){/* 複数タブ時など。失敗しても動作可 */}
    Cloud.enabled=true;return true;
  }catch(e){console.error("Firebase init failed",e);return false;}
}
function setSyncBadge(){const el=document.getElementById("coord");if(!el)return;
  if(Cloud.enabled&&Cloud.user)el.innerHTML='<span style="color:var(--correct);font-weight:700">&#9729; 同期中</span><br>'+esc((Cloud.user.email||"").split("@")[0]);
  else if(Cloud.enabled)el.innerHTML='&#9729; 未ログイン';
  else el.innerHTML='端末内<br>保存';}
function uref(){return Cloud.db.collection("users").doc(Cloud.user.uid);}
function stripUndef(o){Object.keys(o).forEach(k=>{if(o[k]===undefined)delete o[k];});return o;}
function cloudSaveQuestion(q){if(!Cloud.enabled||!Cloud.user||!q||!q.id)return;
  const {id,...data}=q;data.updatedAt=Date.now();if(!data.createdAt)data.createdAt=Date.now();
  uref().collection("questions").doc(id).set(stripUndef(data)).catch(()=>toast("同期エラー：電波の良い場所でもう一度保存してください"));}
function cloudDeleteQuestion(id){if(!Cloud.enabled||!Cloud.user)return;
  uref().collection("questions").doc(id).delete().catch(()=>toast("同期エラー"));}
let __progT=null;
function cloudSaveProgress(){if(!Cloud.enabled||!Cloud.user)return;
  clearTimeout(__progT);
  __progT=setTimeout(()=>{uref().collection("meta").doc("progress").set({history:DB.history,log:DB.log,rabbit:DB.rabbit}).catch(()=>{});},600);}
async function cloudImport(list,mode){if(!Cloud.enabled||!Cloud.user)return;
  try{
    if(mode==="replace"){const snap=await uref().collection("questions").get();
      for(let i=0;i<snap.docs.length;i+=400){const b=Cloud.db.batch();snap.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit();}}
    for(let i=0;i<list.length;i+=400){const b=Cloud.db.batch();
      list.slice(i,i+400).forEach(q=>{const {id,...data}=q;b.set(uref().collection("questions").doc(id),stripUndef(data));});
      await b.commit();}
    cloudSaveProgress();
  }catch(e){toast("クラウドへの書き込みに失敗しました");}}
async function cloudWipe(){if(!Cloud.enabled||!Cloud.user)return;
  try{const snap=await uref().collection("questions").get();
    for(let i=0;i<snap.docs.length;i+=400){const b=Cloud.db.batch();snap.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit();}
    clearTimeout(__progT);await uref().collection("meta").doc("progress").set({history:{},log:{},rabbit:DB.rabbit});
  }catch(e){}}
function softRender(){if(state.view==="edit"||state.view==="quiz")return;render();}
function cloudAttach(){
  Cloud.unsubs.forEach(u=>u());Cloud.unsubs=[];
  let fq,fp;const pq=new Promise(r=>fq=r),pp=new Promise(r=>fp=r);
  Cloud.unsubs.push(uref().collection("questions").onSnapshot(snap=>{
    DB.questions=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    DB.questions.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    normalizeQuestions();fq();softRender();
  },e=>{console.error(e);fq();}));
  Cloud.unsubs.push(uref().collection("meta").doc("progress").onSnapshot(doc=>{
    const d=doc.data();if(d){DB.history=d.history||{};DB.log=d.log||{};if(d.rabbit)DB.rabbit=d.rabbit;}
    fp();softRender();
  },e=>{fp();}));
  return Promise.all([pq,pp]);}
/* ---------- ログイン画面 ---------- */
function renderLogin(){
  app.innerHTML=`<div class="view">
    <div class="eyebrow">ログイン（クラウド同期）</div>
    <div class="panel">
      <div class="hint">パソコンと携帯で<b>同じメールアドレス・パスワード</b>を使うと、問題と学習記録が自動で同期されます。はじめての方は入力して「新規登録」を押してください。</div>
      <div class="field-label">メールアドレス</div>
      <input type="text" id="lg_mail" placeholder="you@example.com" autocomplete="username" inputmode="email">
      <div class="field-label">パスワード（6文字以上）</div>
      <input type="password" id="lg_pass" autocomplete="current-password" style="width:100%;font-family:var(--gothic);font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;margin-top:5px;">
      <div class="stack" style="margin-top:16px">
        <button class="btn primary" onclick="doLogin()"><span>ログイン</span><span class="arw">→</span></button>
        <button class="btn" onclick="doRegister()"><span>新規登録（初回のみ）</span><span class="arw">→</span></button>
        <button class="btn ghost small" onclick="doReset()">パスワードを忘れた（再設定メールを送る）</button>
      </div>
      <div class="hint" id="lg_err" style="color:var(--wrong);margin-top:10px"></div>
    </div></div>`;setSyncBadge();}
function lgVals(){return{mail:(document.getElementById("lg_mail")||{}).value||"",pass:(document.getElementById("lg_pass")||{}).value||""};}
function lgErr(m){const e=document.getElementById("lg_err");if(e)e.textContent=m;}
function jpAuthErr(e){const c=(e&&e.code)||"";
  if(c.includes("invalid-email"))return "メールアドレスの形式が正しくありません";
  if(c.includes("user-not-found"))return "登録がありません。「新規登録」を押してください";
  if(c.includes("wrong-password")||c.includes("invalid-credential"))return "メールかパスワードが違います";
  if(c.includes("email-already-in-use"))return "登録済みです。「ログイン」を押してください";
  if(c.includes("weak-password"))return "パスワードは6文字以上にしてください";
  if(c.includes("too-many-requests"))return "試行が多すぎます。少し時間をおいてください";
  if(c.includes("network"))return "通信できません。電波を確認してください";
  if(c.includes("unauthorized-domain"))return "このドメインが未承認です。Firebaseの承認済みドメインに追加してください";
  return "エラー: "+c;}
async function doLogin(){const {mail,pass}=lgVals();if(!mail||!pass){lgErr("メールとパスワードを入力してください");return;}
  try{await firebase.auth().signInWithEmailAndPassword(mail.trim(),pass);}catch(e){lgErr(jpAuthErr(e));}}
async function doRegister(){const {mail,pass}=lgVals();if(!mail||!pass){lgErr("メールとパスワードを入力してください");return;}
  try{await firebase.auth().createUserWithEmailAndPassword(mail.trim(),pass);}catch(e){lgErr(jpAuthErr(e));}}
async function doReset(){const {mail}=lgVals();if(!mail){lgErr("メールアドレスを入力してください");return;}
  try{await firebase.auth().sendPasswordResetEmail(mail.trim());lgErr("再設定メールを送りました。受信箱を確認してください");}catch(e){lgErr(jpAuthErr(e));}}
function doLogout(){askConfirm("ログアウトしますか？","データはクラウドに保存済みです。再ログインすれば戻ります。","ログアウト",async()=>{Cloud.unsubs.forEach(u=>u());Cloud.unsubs=[];await firebase.auth().signOut();});}

/* ---------- storage: Claude保存領域 → localStorage → メモリ の順にフォールバック ---------- */
const Store=(()=>{
  const mem={};
  const hasCS=(typeof window!=="undefined")&&window.storage&&typeof window.storage.get==="function";
  let ls=null;
  if(!hasCS){try{const t="__tkc_t";window.localStorage.setItem(t,"1");window.localStorage.removeItem(t);ls=window.localStorage;}catch(e){ls=null;}}
  return{persistent:hasCS||!!ls,
    async get(k){
      if(hasCS){try{const r=await window.storage.get(k,false);return r?r.value:null;}catch(e){return null;}}
      if(ls){try{return ls.getItem(k);}catch(e){return null;}}
      return(k in mem)?mem[k]:null;},
    async set(k,v){
      if(hasCS){try{await window.storage.set(k,v,false);return true;}catch(e){return false;}}
      if(ls){try{ls.setItem(k,v);return true;}catch(e){return false;}}
      mem[k]=v;return true;}};
})();
const KEY="tkc_ox_v1";

const CAT_GROUPS=[
  {group:"民法",items:["総則","物権","相続"]},
  {group:"不動産登記法",items:["総論","土地","建物","区分建物","表題部所有者"]},
  {group:"調査士法",items:["調査士法"]}
];
const ALL_CATS=CAT_GROUPS.flatMap(g=>g.items);
function buildYears(){
  const y=[];
  for(let i=17;i<=31;i++)y.push("平成"+i+"年");            // 平成17年〜31年
  // 令和は「今年＋2年分」まで自動で用意する（令和元年 = 2019年）
  const nowR=new Date().getFullYear()-2018;                  // 2026年 → 8
  const maxR=Math.max(7,nowR+2);
  for(let i=1;i<=maxR;i++)y.push("令和"+(i===1?"元":i)+"年");
  return y;}
const YEARS=buildYears();
/* 保存済みデータに未知の年度があれば、選択肢に合流させる（古い年度・独自表記も残す） */
function yearOptions(){const s=new Set(YEARS);DB.questions.forEach(q=>{if(q.year)s.add(q.year);});
  const arr=[...s];
  const rank=v=>{const m=v.match(/^(平成|令和)(元|\d+)年$/);if(!m)return 9999;
    const n=m[2]==="元"?1:+m[2];return m[1]==="平成"?n:100+n;};
  return arr.sort((a,b)=>rank(a)-rank(b));}
const SUBSEQ="アイウエオカキクケコ";
const LABEL_SETS={kana:"アイウエオカキクケコサシスセソ",num:"1234567890",maru:"①②③④⑤⑥⑦⑧⑨⑩"};
function labelAt(style,i){const s=LABEL_SETS[style]||LABEL_SETS.kana;
  if(style==="num")return String(i+1);
  return s[i]||String(i+1);}
function relabel(branches,style){branches.forEach((b,i)=>b.label=labelAt(style,i));}
function detectStyle(q){const l=(q.branches&&q.branches[0]&&q.branches[0].label)||"";
  if(/^[0-9]$/.test(l))return "num";if(/[①-⑩]/.test(l))return "maru";return "kana";}

let DB={questions:[],history:{},log:{},rabbit:{name:"うーちゃん"}};
function uid(){return "q"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function seed(){return{history:{},log:{},rabbit:{name:"うーちゃん"},questions:[
  {id:uid(),type:"set",year:"平成17年",category:"物権",qnum:"見本",mastery:0,
   stem:"次の記述の正誤を判断しなさい。（動作確認用の自作サンプル。削除できます）",
   branches:[
     {label:"ア",text:"所有権に基づき、不法占有者に対して物の返還を請求することができる。",truth:true,expl:"物権的返還請求権。よって○。",mastery:0},
     {label:"イ",text:"建物を新築した所有者は、表題登記を申請する義務を負わない。",truth:false,expl:"1か月以内の申請義務がある。よって×。",mastery:0}
   ],
   combos:["ア","イ","アイ"],comboCorrect:0}
]};}
function normalizeQuestions(){
  DB.questions.forEach(q=>{if(!q.type)q.type="ox";if(typeof q.mastery!=="number")q.mastery=0;
    if(q.type==="set"){if(!Array.isArray(q.branches))q.branches=[];q.branches.forEach((b,i)=>{if(!b.label)b.label=SUBSEQ[i]||"";if(typeof b.mastery!=="number")b.mastery=0;if(b.truth!==true&&b.truth!==false)b.truth=null;});if(!Array.isArray(q.combos))q.combos=[];}});}
async function loadDB(){const raw=await Store.get(KEY);if(raw){try{DB=JSON.parse(raw);}catch(e){DB=seed();}}else{DB=seed();await saveDB();}
  if(!DB.questions)DB.questions=[];if(!DB.history)DB.history={};if(!DB.log)DB.log={};if(!DB.rabbit)DB.rabbit={name:"うーちゃん"};
  normalizeQuestions();}
async function saveDB(){
  if(Cloud.enabled&&Cloud.user){cloudSaveProgress();return;}
  await Store.set(KEY,JSON.stringify(DB));}

/* ---------- 単位(肢)リスト ---------- */
function units(){const out=[];for(const q of DB.questions){
  if(q.type==="set"){let any=false;(q.branches||[]).forEach((br,i)=>{if(br.truth===true||br.truth===false){out.push({q,b:i,key:q.id+"#"+i,mastery:br.mastery||0});any=true;}});
    if(!any)out.push({q,b:null,key:q.id,mastery:q.mastery||0});}
  else out.push({q,b:null,key:q.id,mastery:q.mastery||0});}
  return out;}
function resolveKey(k){const p=k.split("#");const q=DB.questions.find(x=>x.id===p[0]);if(!q)return null;return{q,b:p.length>1?+p[1]:null};}
function stats(){let attempts=0,correct=0;Object.values(DB.history).forEach(h=>{attempts+=h.attempts||0;correct+=h.correct||0;});
  const us=units();const weak=us.filter(u=>u.mastery>0&&u.mastery<=2).length;
  return{total:us.length,attempts,correct,acc:attempts?Math.round(correct/attempts*100):0,weak};}
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function record(key,ok){const h=DB.history[key]||{attempts:0,correct:0,last:null};h.attempts++;if(ok)h.correct++;h.last=ok?"correct":"wrong";h.at=Date.now();DB.history[key]=h;const k=dateKey(new Date());DB.log[k]=(DB.log[k]||0)+1;saveDB();}
function presentCats(){const s=new Set();DB.questions.forEach(q=>{if(q.category)s.add(q.category);});return ALL_CATS.filter(c=>s.has(c)).concat([...s].filter(c=>!ALL_CATS.includes(c)));}
function presentYears(){const s=new Set();DB.questions.forEach(q=>{if(q.year)s.add(q.year);});return yearOptions().filter(y=>s.has(y));}
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600);}

/* ---------- モーダル（標準のconfirm/promptは環境によりブロックされるため自前） ---------- */
let __modalCb=null;
function closeModal(){const b=document.getElementById("modal");if(b)b.remove();__modalCb=null;}
function askConfirm(title,body,okLabel,cb,danger){
  closeModal();__modalCb=cb;
  const el=document.createElement("div");el.id="modal";el.className="modal-back";
  el.innerHTML=`<div class="modal"><div class="mt">${esc(title)}</div>${body?`<div class="mb">${esc(body)}</div>`:""}
    <div class="ma"><button class="mbtn" onclick="closeModal()">キャンセル</button>
    <button class="mbtn ${danger?"dg":"pr"}" onclick="modalOK()">${esc(okLabel||"OK")}</button></div></div>`;
  el.addEventListener("click",e=>{if(e.target===el)closeModal();});
  document.body.appendChild(el);}
function modalOK(){const cb=__modalCb;closeModal();if(cb)cb();}
function askInput(title,initial,okLabel,cb){
  closeModal();__modalCb=cb;
  const el=document.createElement("div");el.id="modal";el.className="modal-back";
  el.innerHTML=`<div class="modal"><div class="mt">${esc(title)}</div>
    <input type="text" id="modal-in" value="${esc(initial||"")}" maxlength="12">
    <div class="ma"><button class="mbtn" onclick="closeModal()">キャンセル</button>
    <button class="mbtn pr" onclick="modalInputOK()">${esc(okLabel||"決定")}</button></div></div>`;

const ACTS=["hop","eat","wash","sniff"];
let __actTimer=null;
function playAct(act){
  const st=document.getElementById("rabbit-stage");if(!st)return;
  const rb=st.querySelector(".rb");if(!rb)return;
  ACTS.forEach(a=>rb.classList.remove("act-"+a));
  const carrot=st.querySelector(".carrot");
  if(carrot)carrot.style.display=(act==="eat")?"block":"none";
  void rb.offsetWidth;                       // 再生をリセット
  rb.classList.add("act-"+act);
  const dur=act==="hop"?1500:(act==="eat"?2600:2000);
  clearTimeout(rb._t);rb._t=setTimeout(()=>{rb.classList.remove("act-"+act);if(carrot)carrot.style.display="none";},dur);
}
function autoAct(){
  clearTimeout(__actTimer);
  const wait=7000+Math.random()*8000;
  __actTimer=setTimeout(()=>{
    if(document.getElementById("rabbit-stage")){
      playAct(ACTS[Math.floor(Math.random()*ACTS.length)]);
      autoAct();
    }
  },wait);
}
function pokeRabbit(){playAct(Math.random()<0.55?"hop":"sniff");autoAct();}

      <button class="btn" onclick="newQuestion()"><span class="btn-main"><span>＋ 問題を入力する</span><span class="btn-sub">問い＋肢を登録（保存で即追加）</span></span><span class="arw">→</span></button>
      <div class="row">
        <button class="btn ghost small" onclick="go('stats')"><span class="btn-main"><span>成績・達成度</span></span><span class="arw">→</span></button>
        <button class="btn ghost small" onclick="go('cal')"><span class="btn-main"><span>カレンダー</span></span><span class="arw">→</span></button>
      </div>
      <button class="btn ghost small" onclick="go('manage')"><span class="btn-main"><span>問題を管理・タグ付け</span></span><span class="arw">→</span></button>
      <button class="btn ghost small" onclick="go('data')"><span class="btn-main"><span>バックアップ・JSON読み込み</span></span><span class="arw">→</span></button>
    </div>

  autoAct();}
function startWeak(){setupCfg={mode:"ox",year:"すべて",cat:"すべて",mastery:new Set([1,2]),count:9999,order:"random"};beginQuiz();}

/* setup */
function renderSetup(){
  const years=["すべて",...presentYears()],cats=["すべて",...presentCats()],counts=[10,20,50,9999],ml=l=>l===0?"未評価":l;
  app.innerHTML=`<div class="view">
    <button class="backlink" onclick="go('home')">← ホーム</button>
    <div class="eyebrow">演習の設定</div>
    <div class="field-label">解き方</div>
    <div class="seg"><button class="chip ${setupCfg.mode==="ox"?"on":""}" onclick="setupCfg.mode='ox';renderSetup()">○×（肢ごと）</button><button class="chip ${setupCfg.mode==="gosen"?"on":""}" onclick="setupCfg.mode='gosen';renderSetup()">5択（問ごと）</button></div>
    <div class="field-label">年度</div><div class="seg">${years.map(y=>`<button class="chip sm ${setupCfg.year===y?"on":""}" onclick="setupCfg.year='${esc(y)}';renderSetup()">${esc(y)}</button>`).join("")}</div>
    <div class="field-label">種別</div><div class="seg">${cats.map(c=>`<button class="chip sm ${setupCfg.cat===c?"on":""}" onclick="setupCfg.cat='${esc(c)}';renderSetup()">${esc(c)}</button>`).join("")}</div>
    <div class="field-label">達成度(複数選択可)</div><div class="seg">${[0,1,2,3,4,5].map(l=>`<button class="chip sm ${setupCfg.mastery.has(l)?"on":""}" onclick="toggleSetupM(${l})">${ml(l)}</button>`).join("")}</div>
    <div class="field-label">問題数</div><div class="seg">${counts.map(n=>`<button class="chip ${setupCfg.count===n?"on":""}" onclick="setupCfg.count=${n};renderSetup()">${n===9999?"全問":n+"問"}</button>`).join("")}</div>
    <div class="field-label">出題順</div><div class="seg"><button class="chip ${setupCfg.order==="random"?"on":""}" onclick="setupCfg.order='random';renderSetup()">ランダム</button><button class="chip ${setupCfg.order==="order"?"on":""}" onclick="setupCfg.order='order';renderSetup()">登録順</button></div>
    ${setupCfg.mode==="gosen"?'<div class="hint" style="margin-top:10px">※5択は「組合せ選択肢と正解番号」を入力した問だけが対象になります。</div>':""}
    <div class="stack" style="margin-top:20px"><button class="btn primary" onclick="beginQuiz()"><span>始める（対象 ${matchPool().length} 問）</span><span class="arw">→</span></button></div>
  </div>`;}
function toggleSetupM(l){if(setupCfg.mastery.has(l))setupCfg.mastery.delete(l);else setupCfg.mastery.add(l);if(!setupCfg.mastery.size)setupCfg.mastery.add(l);renderSetup();}
function gosenOK(q){return q.type==="choice"||(q.type==="set"&&(q.combos||[]).length>=2&&Number.isInteger(q.comboCorrect)&&q.comboCorrect<q.combos.length);}
function matchPool(){
  if(setupCfg.mode==="gosen"){
    let p=DB.questions.filter(gosenOK);
    if(setupCfg.year!=="すべて")p=p.filter(q=>q.year===setupCfg.year);
    if(setupCfg.cat!=="すべて")p=p.filter(q=>q.category===setupCfg.cat);
    p=p.filter(q=>setupCfg.mastery.has(q.mastery||0));
    return p.map(q=>q.id);
  }
  let u=units().filter(x=>x.q.type!=="choice"&&(x.b!==null||x.q.type==="ox"));
  if(setupCfg.year!=="すべて")u=u.filter(x=>x.q.year===setupCfg.year);
  if(setupCfg.cat!=="すべて")u=u.filter(x=>x.q.category===setupCfg.cat);
  u=u.filter(x=>setupCfg.mastery.has(x.mastery));
  return u.map(x=>x.key);}
function beginQuiz(){let pool=matchPool();if(!pool.length){toast("条件に合う問題がありません");return;}
  if(setupCfg.order==="random")pool=shuffle(pool);pool=pool.slice(0,setupCfg.count);
  session={queue:pool,mode:setupCfg.mode,idx:0,results:[],answered:false,chosen:null,startTotal:sumAttempts()};go("quiz");}

/* quiz */
function itemLabel(it){const q=it.q;let s=q.year||"—";if(q.qnum)s+=" "+q.qnum;if(it.b!==null&&q.type==="set")s+=" 肢"+(q.branches[it.b].label||"");else if(q.sub)s+=" "+q.sub;return s;}
function itemMastery(it){return it.b!==null&&it.q.type==="set"?(it.q.branches[it.b].mastery||0):(it.q.mastery||0);}
function setItemMastery(it,lv){if(it.b!==null&&it.q.type==="set")it.q.branches[it.b].mastery=lv;else it.q.mastery=lv;saveDB();cloudSaveQuestion(it.q);}
function renderQuiz(){const key=session.queue[session.idx];const it=resolveKey(key);if(!it)return finishQuiz();
  const q=it.q,total=session.queue.length,n=session.idx+1,answered=session.answered;
  let body="";
  if(it.b!==null&&q.type==="set"){
    const br=q.branches[it.b];const ch=session.chosen;
    const oC="oxbtn o"+(answered?(br.truth?" reveal":(ch===true?" pick-wrong":" dim")):"");
    const xC="oxbtn x"+(answered?(!br.truth?" reveal":(ch===false?" pick-wrong":" dim")):"");
    body=`${q.stem?`<div class="stem">${esc(q.stem)}</div>`:""}
      <div class="qtext"><span class="blab">${esc(br.label)}</span>${esc(br.text)}</div>
      <div class="ox-choices"><button class="${oC}" ${answered?"disabled":""} onclick="answerOx(true)"><span class="mk">○</span><span class="tx">正しい</span></button><button class="${xC}" ${answered?"disabled":""} onclick="answerOx(false)"><span class="mk">✕</span><span class="tx">誤り</span></button></div>`;
  }else if(q.type==="ox"){
    const ch=session.chosen;
    const oC="oxbtn o"+(answered?(q.answer?" reveal":(ch===true?" pick-wrong":" dim")):"");
    const xC="oxbtn x"+(answered?(!q.answer?" reveal":(ch===false?" pick-wrong":" dim")):"");
    body=`${q.stem?`<div class="stem">${esc(q.stem)}</div>`:""}<div class="qtext">${esc(q.statement)}</div>
      <div class="ox-choices"><button class="${oC}" ${answered?"disabled":""} onclick="answerOx(true)"><span class="mk">○</span><span class="tx">正しい</span></button><button class="${xC}" ${answered?"disabled":""} onclick="answerOx(false)"><span class="mk">✕</span><span class="tx">誤り</span></button></div>`;
  }else if(q.type==="set"){ // 5択
    const ch=session.chosen;
    const brs=(q.branches||[]).map(b=>`<div class="branchline"><span class="bl">${esc(b.label)}</span><span>${esc(b.text)}</span>${answered&&(b.truth===true||b.truth===false)?`<span class="mkr ${b.truth?"o":"x"}">${b.truth?"○":"✕"}</span>`:""}</div>`).join("");
    body=`${q.stem?`<div class="stem">${esc(q.stem)}</div>`:""}${brs}
      <div class="choices">${q.combos.map((c,i)=>{let cls="choice";if(answered){if(i===q.comboCorrect)cls+=" correct";else if(i===ch)cls+=" wrong";else cls+=" dim";}return `<button class="${cls}" ${answered?"disabled":""} onclick="answerCh(${i})"><span class="no">${i+1}</span><span>${esc(c)}</span></button>`;}).join("")}</div>`;
  }else{ // legacy choice
    const ch=session.chosen;
    body=`<div class="qtext">${esc(q.question)}</div>
      <div class="choices">${q.choices.map((c,i)=>{let cls="choice";if(answered){if(i===q.correct)cls+=" correct";else if(i===ch)cls+=" wrong";else cls+=" dim";}return `<button class="${cls}" ${answered?"disabled":""} onclick="answerCh(${i})"><span class="no">${i+1}</span><span>${esc(c)}</span></button>`;}).join("")}</div>`;
  }
  app.innerHTML=`<div class="view">
    <div class="quizbar">
      <button class="qbtn" onclick="pauseTo('home')">← 中断してホーム</button>
      <button class="qbtn" onclick="pauseTo('manage')">一覧を見る</button>
      <button class="qbtn danger" onclick="quitQuiz()">やめる</button>
    </div>
    <div class="qmeta"><span class="tagline"><span class="qcat">${esc(q.category||"未分類")}</span><span class="qyear">${esc(itemLabel(it))}</span></span><span>${n} / ${total}</span></div>
    <div class="prog"><span style="width:${Math.round(n/total*100)}%"></span></div>
    ${body}
    ${answered?feedback(it):""}
  </div>`;}
function itemRecordHTML(key){const h=DB.history[key];
  if(!h||!h.attempts)return `<div class="recbar"><span class="rl">この肢の成績</span><span class="rv muted">今回がはじめてです</span></div>`;
  const pct=Math.round(h.correct/h.attempts*100);
  const cls=pct>=80?"g":(pct>=50?"y":"r");
  return `<div class="recbar">
    <span class="rl">この肢の成績</span>
    <span class="rv"><b class="${cls}">${pct}%</b> ・ ${h.attempts}回中 ${h.correct}回 正解</span>
    <span class="rmini"><span class="rmini-f ${cls}" style="width:${pct}%"></span></span>
  </div>`;}
function feedback(it){const q=it.q;let ok,ansTxt,expl="";
  const key=session.queue[session.idx];
  if(it.b!==null&&q.type==="set"){const br=q.branches[it.b];ok=session.chosen===br.truth;ansTxt=br.truth?"○（正しい）":"✕（誤り）";expl=br.expl||"";}
  else if(q.type==="ox"){ok=session.chosen===q.answer;ansTxt=q.answer?"○（正しい）":"✕（誤り）";expl=q.explanation||"";}
  else if(q.type==="set"){ok=session.chosen===q.comboCorrect;ansTxt="正答 "+(q.comboCorrect+1)+"（"+esc(q.combos[q.comboCorrect])+"）";
    expl=(q.branches||[]).filter(b=>b.expl).map(b=>b.label+"　"+b.expl).join("\n");}
  else{ok=session.chosen===q.correct;ansTxt="正答 "+(q.correct+1);expl=q.explanation||"";}
  return `<div class="verdict ${ok?"ok":"ng"}"><b>${ok?"正解":"不正解"}</b>　${ansTxt}</div>
    ${expl?`<div class="expl"><span class="h">解説</span>${esc(expl)}</div>`:""}
    ${itemRecordHTML(key)}
    <div class="mrate"><div class="lab">この${it.b!==null?"肢":"問題"}の達成度をマーク</div>${masteryControl(itemMastery(it),"onQuizMastery")}</div>
    <div class="stack" style="margin-top:16px"><button class="btn primary" onclick="nextQ()"><span>${session.idx+1<session.queue.length?"次の問題":"結果を見る"}</span><span class="arw">→</span></button></div>`;}
function onQuizMastery(l){const it=resolveKey(session.queue[session.idx]);setItemMastery(it,l);renderQuiz();}
function answerOx(b){if(session.answered)return;const key=session.queue[session.idx];const it=resolveKey(key);
  const truth=it.b!==null?it.q.branches[it.b].truth:it.q.answer;
  session.answered=true;session.chosen=b;const ok=b===truth;session.results.push({key,ok});record(key,ok);renderQuiz();}
function answerCh(i){if(session.answered)return;const key=session.queue[session.idx];const it=resolveKey(key);
  const corr=it.q.type==="set"?it.q.comboCorrect:it.q.correct;
  session.answered=true;session.chosen=i;const ok=i===corr;session.results.push({key,ok});record(key,ok);renderQuiz();}
function pauseTo(v){go(v);}
function quitQuiz(){if(session&&session.results.length){askConfirm("演習を終了しますか？","結果画面は表示されませんが、解答の記録は残ります。","終了する",()=>{session=null;go("home");});return;}
  session=null;go("home");}
function resumeQuiz(){if(!session)return;
  session.queue=session.queue.filter(k=>resolveKey(k));
  if(!session.queue.length){session=null;toast("再開できる問題がありません");renderHome();return;}
  if(session.idx>=session.queue.length){session.idx=session.queue.length-1;}
  go("quiz");}
function sessionLeft(){if(!session||session.done)return 0;return Math.max(0,session.queue.length-session.idx);}
function nextQ(){session.idx++;session.answered=false;session.chosen=null;if(session.idx>=session.queue.length)finishQuiz();else{renderQuiz();window.scrollTo(0,0);}}
function finishQuiz(){session.done=true;go("result");}

function wrongPreview(key){const it=resolveKey(key);if(!it)return "";const q=it.q;
  const body=it.b!==null&&q.type==="set"?q.branches[it.b].text:(q.type==="ox"?q.statement:(q.type==="set"?(q.stem||""):(q.question||"")));
  return `<div class="qitem" onclick="go('edit',{id:'${q.id}',from:'result'})"><div class="top"><span class="cat">${esc(q.category||"未分類")}</span><span class="yr">${esc(itemLabel(it))} ${masteryBadge(itemMastery(it))}</span></div><div class="body">${esc(body)}</div></div>`;}
function renderResult(){const r=session.results,correct=r.filter(x=>x.ok).length,total=r.length,wrongKeys=r.filter(x=>!x.ok).map(x=>x.key);
  const after=sumAttempts(),before=session.startTotal||0,li=stageIdx(after),lb=stageIdx(before);
  const levelup=li>lb?`<div class="levelup"><div>${rabbitSVG(li,{size:64})}</div><div class="t">たくさん解いたね。<br>うさぎが育って <b>「${esc(STAGES[li].name)}」</b> になったよ。</div></div>`:"";
  const gentle=`<div class="rabbit" style="margin-top:14px"><div class="top"><div class="scene">${rabbitSVG(li,{size:74})}</div><div class="info"><div class="nm" style="cursor:default">${esc(rabbitName())}</div><div class="msg">${esc(correct===total?"ぜんぶ正解、すごい!この調子だよ。":rabbitMessage())}</div></div></div></div>`;
  app.innerHTML=`<div class="view">
    <div class="eyebrow">演習おわり</div>
    <div class="score-big">${correct}<span style="font-size:24px;color:var(--muted)">/${total}</span></div>
    <div class="score-cap">正答率 ${total?Math.round(correct/total*100):0}%</div>
    ${levelup}${gentle}
    ${wrongKeys.length?`<div class="eyebrow">間違えた問題（${wrongKeys.length}）</div>`+wrongKeys.map(wrongPreview).join(""):""}
    <div class="stack" style="margin-top:22px">
      ${wrongKeys.length?`<button class="btn" onclick='retryWrong(${JSON.stringify(wrongKeys)})'><span>間違いだけ解き直す</span><span class="arw">→</span></button>`:""}
      <button class="btn primary" onclick="go('home')"><span>ホームに戻る</span><span class="arw">→</span></button>
    </div></div>`;}
function retryWrong(keys){session={queue:shuffle(keys),mode:session.mode,idx:0,results:[],answered:false,chosen:null,startTotal:sumAttempts()};go("quiz");}

/* manage */
function qSearchText(q){let s=(q.year||"")+(q.qnum||"")+(q.category||"");
  if(q.type==="set")s+=(q.stem||"")+(q.branches||[]).map(b=>b.text+(b.expl||"")).join("");
  else if(q.type==="ox")s+=(q.stem||"")+(q.statement||"")+(q.explanation||"");
  else s+=(q.question||"")+(q.choices||[]).join("");
  return s;}
function manageList(){let list=DB.questions.slice().reverse();
  if(mg.search.trim()){const k=mg.search.trim();list=list.filter(q=>qSearchText(q).includes(k));}
  if(mg.year!=="すべて")list=list.filter(q=>q.year===mg.year);
  if(mg.cat!=="すべて")list=list.filter(q=>q.category===mg.cat);
  list=list.filter(q=>{if(q.type==="set")return (q.branches||[]).some(b=>mg.mastery.has(b.mastery||0))||mg.mastery.has(q.mastery||0);return mg.mastery.has(q.mastery||0);});
  return list;}
function renderManage(){const years=["すべて",...presentYears()],cats=["すべて",...presentCats()],ml=l=>l===0?"未評価":l;
  const resume=(session&&sessionLeft()>0)?`<button class="btn primary" onclick="resumeQuiz()"><span class="btn-main"><span>演習に戻る</span><span class="btn-sub" style="color:rgba(255,255,255,.75)">のこり ${sessionLeft()} 問</span></span><span class="arw">▶</span></button>`:"";
  app.innerHTML=`<div class="view">
    <button class="backlink" onclick="go('home')">← ホーム</button>
    ${resume}
    <div class="eyebrow">問題を管理（${DB.questions.length}）</div>
    <button class="btn primary" onclick="newQuestion()"><span>＋ 新しい問題を入力</span><span class="arw">→</span></button>
    <input type="text" placeholder="キーワード検索" value="${esc(mg.search)}" oninput="mg.search=this.value;refreshList()" style="margin-top:12px">
    <div class="rowlabel">年度</div><div class="seg">${years.map(y=>`<button class="chip sm ${mg.year===y?"on":""}" onclick="mg.year='${esc(y)}';renderManage()">${esc(y)}</button>`).join("")}</div>
    <div class="rowlabel">種別</div><div class="seg">${cats.map(c=>`<button class="chip sm ${mg.cat===c?"on":""}" onclick="mg.cat='${esc(c)}';renderManage()">${esc(c)}</button>`).join("")}</div>
    <div class="rowlabel">達成度</div><div class="seg">${[0,1,2,3,4,5].map(l=>`<button class="chip sm ${mg.mastery.has(l)?"on":""}" onclick="toggleMgM(${l})">${ml(l)}</button>`).join("")}</div>
    <div id="qlist" style="margin-top:8px">${renderQList(manageList())}</div>
  </div>`;}
function toggleMgM(l){if(mg.mastery.has(l))mg.mastery.delete(l);else mg.mastery.add(l);refreshList();}
function refreshList(){const el=document.getElementById("qlist");if(el)el.innerHTML=renderQList(manageList());}
function qStatHTML(q){let att=0,cor=0;
  if(q.type==="set"){(q.branches||[]).forEach((b,i)=>{const h=DB.history[q.id+"#"+i];if(h){att+=h.attempts||0;cor+=h.correct||0;}});}
  const h=DB.history[q.id];if(h){att+=h.attempts||0;cor+=h.correct||0;}
  if(!att)return `<span class="rate muted">未挑戦</span>`;
  const pct=Math.round(cor/att*100),cls=pct>=80?"g":(pct>=50?"y":"r");
  return `<span class="rate ${cls}">${pct}%<span class="sm">・${att}回</span></span>`;}
function renderQList(list){if(!list.length)return `<div class="empty"><div class="mk">▦</div>条件に合う問題がありません。</div>`;
  return list.map(q=>{
    let tag,body;
    if(q.type==="set"){const n=(q.branches||[]).length;tag=`肢${n}${gosenOK(q)?"・5択可":""}`;body=q.stem||(q.branches[0]?q.branches[0].text:"");}
    else if(q.type==="ox"){tag=q.answer?"○":"✕";body=q.statement;}
    else{tag="5択";body=q.question;}
    return `<div class="qitem" onclick="go('edit',{id:'${q.id}',from:'manage'})"><div class="top"><span class="cat">${esc(q.category||"未分類")}</span><span class="yr">${esc(q.year||"—")}${q.qnum?" "+esc(q.qnum):""}　${esc(tag)}　${qStatHTML(q)}</span></div><div class="body">${esc(body)}</div></div>`;}).join("");}

/* edit(set) */
function newQuestion(){const st=(editModel&&editModel.labelStyle)||"kana";
  editModel={id:null,type:"set",year:"",category:"物権",qnum:"",stem:"",labelStyle:st,
  branches:Array.from({length:5},(_,i)=>({label:labelAt(st,i),text:"",truth:null,expl:"",mastery:0})),
  combosText:"",comboCorrect:null,mastery:0};go("edit",{from:"manage"});}
function loadEditModel(id){const q=DB.questions.find(x=>x.id===id);
  if(q.type==="set"){editModel={id:q.id,type:"set",year:q.year||"",category:q.category||"",qnum:q.qnum||"",stem:q.stem||"",labelStyle:detectStyle(q),
    branches:(q.branches||[]).map(b=>({label:b.label,text:b.text||"",truth:b.truth,expl:b.expl||"",mastery:b.mastery||0})),
    combosText:(q.combos||[]).join("、"),comboCorrect:Number.isInteger(q.comboCorrect)?q.comboCorrect:null,mastery:q.mastery||0};}
  else if(q.type==="ox"){editModel={id:q.id,type:"set",year:q.year||"",category:q.category||"",qnum:q.qnum||"",stem:q.stem||"",labelStyle:"kana",
    branches:[{label:q.sub||"ア",text:q.statement||"",truth:(typeof q.answer==="boolean"?q.answer:null),expl:q.explanation||"",mastery:q.mastery||0}],
    combosText:"",comboCorrect:null,mastery:q.mastery||0,convertFrom:"ox"};}
  else{editModel={id:q.id,type:"choice",year:q.year||"",category:q.category||"",qnum:q.qnum||"",question:q.question||"",
    choices:(q.choices||[]).map((c,i)=>({text:c,correct:i===q.correct})),explanation:q.explanation||"",mastery:q.mastery||0};}}
function catSelectHTML(sel){const custom=sel&&!ALL_CATS.includes(sel);return CAT_GROUPS.map(g=>`<optgroup label="${g.group}">`+g.items.map(c=>`<option ${c===sel?"selected":""}>${c}</option>`).join("")+`</optgroup>`).join("")+`<option value="__new__" ${custom?"selected":""}>＋ 新しい種別</option>`;}
function yearSelectHTML(sel){const list=yearOptions();const custom=sel&&!list.includes(sel);
  return `<option value="" ${sel?"":"selected"}>（未設定）</option>`+list.map(y=>`<option ${y===sel?"selected":""}>${y}</option>`).join("")+`<option value="__new__" ${custom?"selected":""}>＋ 年度を自由入力</option>`;}
function renderEdit(){if(state.id&&(!editModel||editModel.id!==state.id))loadEditModel(state.id);if(!editModel)return newQuestion();
  const m=editModel;
  if(m.type==="choice")return renderEditChoice();
  const catCustom=m.category&&!ALL_CATS.includes(m.category),yearCustom=m.year&&!yearOptions().includes(m.year);
  const back=state.from==="result"?"go('result')":"go('manage')";
  const branchRows=m.branches.map((b,i)=>{
    const h=m.id?DB.history[m.id+"#"+i]:null;
    const rec=(h&&h.attempts)?(()=>{const p=Math.round(h.correct/h.attempts*100);const c=p>=80?"g":(p>=50?"y":"r");return `<span class="rate ${c}">${p}%<span class="sm">・${h.attempts}回</span></span>`;})():`<span class="rate muted">未挑戦</span>`;
    return `
    <div class="bredit">
      <div class="bhead"><span class="bl">${esc(b.label||SUBSEQ[i]||"")}</span>
        <div class="truthpick">
          <button class="o ${b.truth===true?"sel":""}" onclick="ed_truth(${i},true)">○</button>
          <button class="x ${b.truth===false?"sel":""}" onclick="ed_truth(${i},false)">✕</button>
          <button class="n ${b.truth===null?"sel":""}" onclick="ed_truth(${i},null)">未</button>
        </div><span class="sp"></span>${rec}
        ${m.branches.length>1?`<button class="rm" onclick="ed_rmBranch(${i})">×</button>`:""}
      </div>
      <textarea rows="2" placeholder="肢の記述" oninput="editModel.branches[${i}].text=this.value">${esc(b.text)}</textarea>
      <input type="text" placeholder="この肢の解説（任意・自分の言葉で）" value="${esc(b.expl)}" oninput="editModel.branches[${i}].expl=this.value">
    </div>`;}).join("");
  app.innerHTML=`<div class="view">
    <button class="backlink" onclick="${back}">← ${state.from==="result"?"結果":"一覧"}へ</button>
    <div class="eyebrow">${m.id?"問題を編集":"新しい問題"}</div>
    <div class="row">
      <div><div class="field-label">年度</div><select id="f_year">${yearSelectHTML(m.year)}</select><input type="text" id="f_yearnew" placeholder="例）令和5年" value="${yearCustom?esc(m.year):""}" style="display:${yearCustom?"block":"none"}" oninput="editModel.year=this.value"></div>
      <div style="max-width:110px"><div class="field-label">問番</div><input type="text" placeholder="問1" value="${esc(m.qnum)}" oninput="editModel.qnum=this.value"></div>
    </div>
    <div class="field-label">種別</div><select id="f_cat">${catSelectHTML(m.category)}</select>
    <input type="text" id="f_catnew" placeholder="新しい種別名" value="${catCustom?esc(m.category):""}" style="display:${catCustom?"block":"none"}" oninput="editModel.category=this.value">
    <div class="field-label">問い（柱書・共通の設定。任意）</div>
    <textarea rows="3" placeholder="例）A、B及びCが甲建物を共有している場合に関する次の記述について…" oninput="editModel.stem=this.value">${esc(m.stem)}</textarea>
    <div class="field-label">肢の記号</div>
    <div class="seg">
      <button class="chip sm ${m.labelStyle==="kana"?"on":""}" onclick="ed_style('kana')">ア イ ウ</button>
      <button class="chip sm ${m.labelStyle==="num"?"on":""}" onclick="ed_style('num')">1 2 3</button>
      <button class="chip sm ${m.labelStyle==="maru"?"on":""}" onclick="ed_style('maru')">① ② ③</button>
    </div>
    <div class="field-label">肢（○＝正しい／✕＝誤り。○×を付けた肢が一問一答に出ます）・現在 ${m.branches.length} 肢</div>
    ${branchRows}
    <div class="row" style="margin-top:10px">
      <button class="btn ghost small" onclick="ed_addBranch()">＋ 肢を追加</button>
      <button class="btn ghost small" onclick="ed_rmLast()" ${m.branches.length<=1?"disabled":""}>− 末尾を削除</button>
    </div>
    <div class="field-label">5択用：組合せ選択肢（任意・「、」区切りで5つ）</div>
    <input type="text" placeholder="例）アイ、アオ、ウエ、ウオ、エオ" value="${esc(m.combosText)}" oninput="editModel.combosText=this.value">
    <div class="field-label">5択の正解番号</div>
    <select onchange="editModel.comboCorrect=this.value===''?null:(+this.value)"><option value="" ${m.comboCorrect==null?"selected":""}>未設定（5択に出さない）</option>${[0,1,2,3,4].map(i=>`<option value="${i}" ${m.comboCorrect===i?"selected":""}>${i+1}</option>`).join("")}</select>
    <div class="hint">○×だけ入れれば一問一答に、組合せ＋正解も入れれば同じ問題を5択でも解けます。</div>
    <div class="stack" style="margin-top:22px">
      <button class="btn primary" onclick="saveSet(true)"><span>保存して次の問へ</span><span class="arw">→</span></button>
      <button class="btn small" onclick="saveSet(false)">保存して一覧へ戻る</button>
      ${m.id?`<button class="btn danger small" onclick="deleteQuestion()">この問題を削除</button>`:""}
    </div><div style="height:10px"></div></div>`;
  const cs=document.getElementById("f_cat");if(cs)cs.onchange=()=>{const nf=document.getElementById("f_catnew");if(cs.value==="__new__"){nf.style.display="block";editModel.category="";nf.focus();}else{nf.style.display="none";editModel.category=cs.value;}};
  const ys=document.getElementById("f_year");if(ys)ys.onchange=()=>{const nf=document.getElementById("f_yearnew");if(ys.value==="__new__"){nf.style.display="block";editModel.year="";nf.focus();}else{nf.style.display="none";editModel.year=ys.value;}};}
function ed_truth(i,t){editModel.branches[i].truth=t;renderEdit();}
function ed_style(s){editModel.labelStyle=s;relabel(editModel.branches,s);renderEdit();}
function ed_addBranch(){const m=editModel;m.branches.push({label:"",text:"",truth:null,expl:"",mastery:0});relabel(m.branches,m.labelStyle);renderEdit();}
function ed_rmLast(){const m=editModel;if(m.branches.length<=1)return;m.branches.pop();relabel(m.branches,m.labelStyle);renderEdit();}
function ed_rmBranch(i){const m=editModel;m.branches.splice(i,1);relabel(m.branches,m.labelStyle);renderEdit();}
function saveSet(next){const m=editModel;
  if(!m.category||!m.category.trim()){toast("種別を選んでください");return;}
  const kept=m.branches.filter(b=>b.text.trim()!=="");
  const branches=kept.map((b,j)=>({label:labelAt(m.labelStyle,j),text:b.text.trim(),truth:b.truth,expl:(b.expl||"").trim(),mastery:b.mastery||0}));
  if(!branches.length&&!m.stem.trim()){toast("問いか肢を入力してください");return;}
  const combos=m.combosText.split(/[、,\s/・]+/).map(s=>s.trim()).filter(Boolean);
  let cc=m.comboCorrect;if(!(Number.isInteger(cc)&&combos.length>=2&&cc<combos.length))cc=null;
  const obj={type:"set",year:(m.year||"").trim(),category:m.category.trim(),qnum:(m.qnum||"").trim(),stem:m.stem.trim(),branches,combos,comboCorrect:cc,mastery:m.mastery||0};
  if(m.id){const old=DB.questions.find(x=>x.id===m.id);
    if(m.convertFrom==="ox"){delete old.statement;delete old.answer;delete old.sub;delete old.explanation;}
    Object.assign(old,obj);old.type="set";old.updatedAt=Date.now();cloudSaveQuestion(old);}
  else{obj.id=uid();obj.createdAt=Date.now();obj.updatedAt=Date.now();DB.questions.push(obj);cloudSaveQuestion(obj);}
  saveDB();
  if(next){const nq=incQnum(m.qnum),st=m.labelStyle,cnt=Math.max(1,m.branches.length);
    editModel={id:null,type:"set",year:m.year,category:m.category,qnum:nq,stem:"",labelStyle:st,
      branches:Array.from({length:cnt},(_,i)=>({label:labelAt(st,i),text:"",truth:null,expl:"",mastery:0})),combosText:"",comboCorrect:null,mastery:0};
    toast("保存しました"+(nq?" → 次は "+nq:""));state={view:"edit",from:"manage"};renderEdit();window.scrollTo(0,0);
  }else{editModel=null;toast("保存しました");go(state.from==="result"?"result":"manage");}}
/* legacy 5択 edit */
function renderEditChoice(){const m=editModel;const catCustom=m.category&&!ALL_CATS.includes(m.category),yearCustom=m.year&&!yearOptions().includes(m.year);
  const back=state.from==="result"?"go('result')":"go('manage')";
  app.innerHTML=`<div class="view">
    <button class="backlink" onclick="${back}">← 戻る</button>
    <div class="eyebrow">5択問題を編集</div>
    <div class="row">
      <div><div class="field-label">年度</div><select id="f_year">${yearSelectHTML(m.year)}</select><input type="text" id="f_yearnew" value="${yearCustom?esc(m.year):""}" style="display:${yearCustom?"block":"none"}" oninput="editModel.year=this.value"></div>
      <div style="max-width:110px"><div class="field-label">問番</div><input type="text" value="${esc(m.qnum)}" oninput="editModel.qnum=this.value"></div>
    </div>
    <div class="field-label">種別</div><select id="f_cat">${catSelectHTML(m.category)}</select>
    <input type="text" id="f_catnew" value="${catCustom?esc(m.category):""}" style="display:${catCustom?"block":"none"}" oninput="editModel.category=this.value">
    <div class="field-label">問題文</div><textarea oninput="editModel.question=this.value">${esc(m.question)}</textarea>
    <div class="field-label">選択肢（○＝正解）</div>
    ${m.choices.map((c,i)=>`<div class="choice-edit" style="display:flex;gap:9px;align-items:center;margin-top:8px"><input type="radio" name="cc" style="width:22px;height:22px;accent-color:var(--brand)" ${c.correct?"checked":""} onchange="editModel.choices.forEach((x,j)=>x.correct=(j===${i}))"><input type="text" value="${esc(c.text)}" oninput="editModel.choices[${i}].text=this.value"></div>`).join("")}
    <div class="field-label">解説</div><textarea oninput="editModel.explanation=this.value">${esc(m.explanation)}</textarea>
    <div class="stack" style="margin-top:22px">
      <button class="btn primary" onclick="saveChoice()"><span>保存する</span><span class="arw">✓</span></button>
      <button class="btn danger small" onclick="deleteQuestion()">この問題を削除</button>
    </div></div>`;
  const cs=document.getElementById("f_cat");if(cs)cs.onchange=()=>{const nf=document.getElementById("f_catnew");if(cs.value==="__new__"){nf.style.display="block";editModel.category="";nf.focus();}else{nf.style.display="none";editModel.category=cs.value;}};
  const ys=document.getElementById("f_year");if(ys)ys.onchange=()=>{const nf=document.getElementById("f_yearnew");if(ys.value==="__new__"){nf.style.display="block";editModel.year="";nf.focus();}else{nf.style.display="none";editModel.year=ys.value;}};}
function saveChoice(){const m=editModel;const choices=m.choices.map(c=>c.text.trim()).filter(Boolean);
  if(!m.question.trim()||choices.length<2){toast("問題文と選択肢2つ以上が必要です");return;}
  let ci=m.choices.filter(c=>c.text.trim()!=="").findIndex(c=>c.correct);if(ci<0)ci=0;
  const qq=DB.questions.find(x=>x.id===m.id);
  Object.assign(qq,{year:m.year.trim(),category:m.category.trim(),qnum:(m.qnum||"").trim(),question:m.question.trim(),choices,correct:ci,explanation:(m.explanation||"").trim(),updatedAt:Date.now()});
  cloudSaveQuestion(qq);
  saveDB();editModel=null;toast("保存しました");go("manage");}
function deleteQuestion(){const id=editModel&&editModel.id;if(!id){toast("まだ保存されていません");return;}
  askConfirm("この問題を削除しますか？","肢や解答の記録も一緒に消えます。元に戻せません。","削除する",()=>{
    DB.questions=DB.questions.filter(x=>x.id!==id);
    Object.keys(DB.history).forEach(k=>{if(k===id||k.startsWith(id+"#"))delete DB.history[k];});
    if(session)session.queue=session.queue.filter(k=>!(k===id||k.startsWith(id+"#")));
    saveDB();cloudDeleteQuestion(id);editModel=null;toast("削除しました");go("manage");
  },true);}

/* stats */
function groupMetrics(keyFn){const map={};units().forEach(u=>{const k=keyFn(u.q)||"未設定";const g=map[k]||(map[k]={count:0,msum:0,solved:0});g.count++;g.msum+=u.mastery;if(DB.history[u.key]&&DB.history[u.key].attempts>0)g.solved++;});return map;}
function metricRow(label,g){const mp=g.count?Math.round(g.msum/(g.count*5)*100):0;const sp=g.count?Math.round(g.solved/g.count*100):0;
  return `<div class="mrow"><div class="lbl"><span>${esc(label)}<span style="color:var(--muted);font-size:11px"> ・${g.count}肢</span></span><span class="pct">達成度 ${mp}%</span></div><div class="bar"><span style="width:${mp}%"></span></div><div class="sub">演習済み ${sp}%（${g.solved}/${g.count}）</div></div>`;}
function renderStats(){const us=units();const total=us.length;let msum=0,solved=0;us.forEach(u=>{msum+=u.mastery;if(DB.history[u.key]&&DB.history[u.key].attempts>0)solved++;});
  const mp=total?Math.round(msum/(total*5)*100):0,sp=total?Math.round(solved/total*100):0;
  const byYear=groupMetrics(q=>q.year),byCat=groupMetrics(q=>q.category);
  const yKeys=yearOptions().filter(y=>byYear[y]).concat(Object.keys(byYear).filter(k=>!yearOptions().includes(k)));
  const cKeys=ALL_CATS.filter(c=>byCat[c]).concat(Object.keys(byCat).filter(k=>!ALL_CATS.includes(k)));
  app.innerHTML=`<div class="view">
    <button class="backlink" onclick="go('home')">← ホーム</button>
    <div class="eyebrow">全体</div>
    <div class="bigwrap">
      <div class="bigcard"><div class="p">${mp}<span style="font-size:18px">%</span></div><div class="l">達成度 到達率</div><div class="s">満点(5)に対して</div></div>
      <div class="bigcard"><div class="p">${sp}<span style="font-size:18px">%</span></div><div class="l">演習済み</div><div class="s">${solved}/${total} 肢</div></div>
    </div>
    <div class="eyebrow">年度別</div>
    ${yKeys.length?yKeys.map(y=>metricRow(y,byYear[y])).join(""):'<div class="hint">まだ年度タグ付きの問題がありません。</div>'}
    <div class="eyebrow">種別別</div>
    ${cKeys.length?cKeys.map(c=>metricRow(c,byCat[c])).join(""):'<div class="hint">まだ種別タグ付きの問題がありません。</div>'}
    <div style="height:16px"></div></div>`;}

/* calendar */
let calView=null;
function renderCalendar(){
  if(!calView){const n=new Date();calView={y:n.getFullYear(),m:n.getMonth()};}
  const {y,m}=calView;const startDow=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const todK=dateKey(new Date());
  let monthTotal=0,maxC=1;for(let d=1;d<=days;d++){const c=DB.log[dateKey(new Date(y,m,d))]||0;monthTotal+=c;maxC=Math.max(maxC,c);}
  const grand=Object.values(DB.log).reduce((a,b)=>a+b,0);
  const dows=["日","月","火","水","木","金","土"];
  let cells="";for(let i=0;i<startDow;i++)cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=days;d++){const k=dateKey(new Date(y,m,d));const c=DB.log[k]||0;
    const alpha=c?(0.25+0.75*Math.min(c/maxC,1)).toFixed(2):0;
    cells+=`<div class="cal-cell ${k===todK?"today":""}" style="${c?`background:rgba(47,93,80,${alpha})`:""}"><span class="d" style="${c?'color:rgba(255,255,255,.85)':''}">${d}</span>${c?`<span class="c">${c}</span>`:""}</div>`;}
  app.innerHTML=`<div class="view">
    <button class="backlink" onclick="go('home')">← ホーム</button>
    <div class="eyebrow">学習カレンダー</div>
    <div class="cal-head"><button class="cal-nav" onclick="calMove(-1)">‹</button><div class="mo">${y}年 ${m+1}月</div><button class="cal-nav" onclick="calMove(1)">›</button></div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join("")}${cells}</div>
    <div class="bigwrap" style="margin-top:16px">
      <div class="bigcard"><div class="p">${monthTotal}</div><div class="l">今月の解答数</div></div>
      <div class="bigcard"><div class="p">${grand}</div><div class="l">累計の解答数</div></div>
    </div>
    <div class="hint" style="margin-top:12px">色が濃い日ほどたくさん解いた日です。</div>
  </div>`;}
function calMove(delta){let m=calView.m+delta,y=calView.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}calView={y,m};renderCalendar();}

/* data */
function renderData(){const json=JSON.stringify(DB.questions.map(({id,...r})=>r),null,2);
  app.innerHTML=`<div class="view">
    <button class="backlink" onclick="go('home')">← ホーム</button>
    <div class="eyebrow">バックアップ・JSON読み込み</div>
    ${(Cloud.enabled&&Cloud.user)?`<div class="panel" style="margin-top:4px"><div style="font-size:13px">&#9729; クラウド同期中：<b>${esc(Cloud.user.email||"")}</b></div><div class="hint">問題と学習記録は自動でクラウドに保存されています。同じアカウントでログインすれば、どの端末でも同じデータが使えます。</div><button class="btn small" style="margin-top:10px" onclick="doLogout()">ログアウト</button></div>`:""}
    <div class="hint">全データ(JSON)です。コピーして保存すれば復元でき、別の端末や公開版アプリへの引っ越しにも使えます。学習記録(履歴・カレンダー)は含まれません。</div>
    <div class="field-label">書き出し</div><textarea id="exp" style="min-height:120px;font-family:var(--mono);font-size:12px" readonly>${esc(json)}</textarea>
    <button class="btn small" style="margin-top:8px" onclick="copyExport()">コピー</button>
    <div class="field-label">読み込み（貼り付け）</div>
    <textarea id="imp" placeholder='[ {"type":"set","year":"平成17年","qnum":"問1","category":"物権","stem":"…","branches":[{"label":"ア","text":"…","truth":true,"expl":"…"}],"combos":["アイ","アオ"],"comboCorrect":0} ]' style="min-height:110px;font-family:var(--mono);font-size:12px"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn small" onclick="doImport('add')">追加で読み込む</button><button class="btn small danger" onclick="doImport('replace')">全置き換え</button></div>
    <div class="warn">「全消去」は元に戻せません。先にバックアップを。</div>
    <button class="btn danger small" style="margin-top:10px" onclick="wipe()">全データを消去</button><div style="height:10px"></div>
  </div>`;}
function copyExport(){const ta=document.getElementById("exp");ta.select();ta.setSelectionRange(0,99999);try{navigator.clipboard.writeText(ta.value);}catch(e){}toast("コピーしました");}
function doImport(mode){const txt=document.getElementById("imp").value.trim();if(!txt){toast("貼り付けてください");return;}
  let arr;try{arr=JSON.parse(txt);}catch(e){toast("形式が正しくありません");return;}if(!Array.isArray(arr)){toast("配列[ ]にしてください");return;}
  const cleaned=[];
  for(const q of arr){if(!q)continue;
    if(q.type==="set"&&Array.isArray(q.branches)){
      const branches=q.branches.filter(b=>b&&b.text).map((b,j)=>({label:b.label||SUBSEQ[j]||"",text:String(b.text),truth:(b.truth===true||b.truth===false)?b.truth:null,expl:b.expl?String(b.expl):"",mastery:Number.isInteger(b.mastery)?Math.max(0,Math.min(b.mastery,5)):0}));
      if(!branches.length&&!q.stem)continue;
      const combos=Array.isArray(q.combos)?q.combos.map(String):[];
      const cc=(Number.isInteger(q.comboCorrect)&&q.comboCorrect<combos.length)?q.comboCorrect:null;
      cleaned.push({id:uid(),type:"set",year:q.year||"",category:q.category||"未分類",qnum:q.qnum||"",stem:q.stem?String(q.stem):"",branches,combos,comboCorrect:cc,mastery:Number.isInteger(q.mastery)?Math.max(0,Math.min(q.mastery,5)):0});
    }else if(q.type==="choice"||(Array.isArray(q.choices)&&q.question)){
      if(!q.question||!Array.isArray(q.choices)||q.choices.length<2)continue;
      cleaned.push({id:uid(),type:"choice",year:q.year||"",category:q.category||"未分類",qnum:q.qnum||"",question:String(q.question),choices:q.choices.map(String),correct:Number.isInteger(q.correct)?Math.max(0,Math.min(q.correct,q.choices.length-1)):0,explanation:q.explanation||"",mastery:Number.isInteger(q.mastery)?Math.max(0,Math.min(q.mastery,5)):0});
    }else if(q.statement){
      cleaned.push({id:uid(),type:"ox",year:q.year||"",category:q.category||"未分類",qnum:q.qnum||"",sub:q.sub||"",stem:q.stem||"",statement:String(q.statement),answer:!!q.answer,explanation:q.explanation||"",mastery:Number.isInteger(q.mastery)?Math.max(0,Math.min(q.mastery,5)):0});}}
  if(!cleaned.length){toast("読み込める問題がありません");return;}
  const apply=()=>{const base=Date.now();cleaned.forEach((q,i)=>{q.createdAt=base+i;q.updatedAt=base+i;});
    if(mode==="replace"){DB.questions=cleaned;DB.history={};session=null;}else{DB.questions=DB.questions.concat(cleaned);}
    saveDB();cloudImport(cleaned,mode);toast(cleaned.length+"問を読み込みました");go("home");};
  if(mode==="replace")askConfirm("既存データを置き換えますか？",cleaned.length+"問に入れ替わり、いまの問題と解答履歴は消えます。","置き換える",apply,true);
  else apply();}
function wipe(){askConfirm("すべての問題と記録を消去しますか？","問題・解答履歴・カレンダーがすべて消えます。元に戻せません。","すべて消去",()=>{
  const rb=DB.rabbit;DB={questions:[],history:{},log:{},rabbit:rb};session=null;saveDB();cloudWipe();toast("消去しました");go("home");},true);}

(async function(){
  const cloud=await initCloud();
  setSyncBadge();
  if(cloud){
    firebase.auth().onAuthStateChanged(async u=>{
      Cloud.user=u;setSyncBadge();
      if(u){
        DB={questions:[],history:{},log:{},rabbit:{name:"うーちゃん"}};
        await cloudAttach();
        session=null;state={view:"home"};render();
      }else{
        session=null;state={view:"home"};renderLogin();
      }
    });
  }else{
    await loadDB();render();
  }
})();
</script>
